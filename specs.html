<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DONG 包裝規格查詢</title>
<meta name="description" content="包裝規格互動查詢：點任何圖表或數字卡片即可交叉篩選。資料只在瀏覽器內處理，不會上傳。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f9fafb;
    --text: #1b2430;
    --muted: #5b6776;
    --faint: #898781;
    --line: #dde2e8;
    --accent: #1f5fa8;
    --accent-soft: #e9f0f9;
    --series: #2a78d6;
    --ghost: #dbe8f8;
    --off: #c9ccd1;
    --crit: #d03b3b;
    --crit-soft: #fcebea;
    --warn: #b27500;
    --warn-mark: #fab219;
    --warn-soft: #fff4d9;
    --good: #0a7d0a;
    --mark: #ffe58a;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141a;
      --surface: #171e26;
      --surface-2: #1b232d;
      --text: #e6ebf1;
      --muted: #9aa7b5;
      --faint: #898781;
      --line: #2b3541;
      --accent: #72aaf0;
      --accent-soft: #1a2a3e;
      --series: #3987e5;
      --ghost: #1f324a;
      --off: #3a4450;
      --crit: #e66767;
      --crit-soft: #3a1c1c;
      --warn: #fab219;
      --warn-mark: #fab219;
      --warn-soft: #33270f;
      --good: #0ca30c;
      --mark: #6b5a1f;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body { margin: 0; padding-inline: 16px; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font); -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; line-height: 1.35; }
  .num { font-variant-numeric: tabular-nums; }

  .btn { display: inline-flex; align-items: center; gap: .35rem; padding: .45rem .85rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: .9rem; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .btn:disabled { opacity: .45; cursor: default; border-color: var(--line); }
  .btn.sm { padding: .25rem .6rem; font-size: .82rem; }

  /* 頁首 */
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; padding-block: 1.25rem .75rem; }
  .top .back { font-size: .88rem; color: var(--muted); text-decoration: none; }
  .top .back:hover { color: var(--accent); }
  .top h1 { font-size: 1.5rem; }
  .top .spacer { flex: 1; }
  .top .acts { display: flex; flex-wrap: wrap; gap: .5rem; }
  .source { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; padding: .6rem .9rem; border-radius: 8px; font-size: .88rem; margin-bottom: .75rem; }
  .source.demo { background: var(--warn-soft); border-left: 4px solid var(--warn-mark); }
  .source.mine { background: var(--accent-soft); border-left: 4px solid var(--accent); }
  .source b { font-weight: 700; }
  .source .grow { flex: 1; min-width: 12rem; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: .88rem; text-decoration: underline; }

  /* 篩選列 */
  .filters { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-block: .6rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; }
  .frow { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .search { flex: 1 1 18rem; position: relative; }
  .search input { width: 100%; padding: .55rem .9rem .55rem 2.2rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .search::before { content: "⌕"; position: absolute; left: .75rem; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 1.1rem; }
  .search kbd { position: absolute; right: .6rem; top: 50%; transform: translateY(-50%); font: 600 .72rem var(--font); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 .35rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; align-items: center; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .35rem .2rem .7rem; border-radius: 999px; background: var(--accent-soft); border: 1px solid transparent; font-size: .84rem; }
  .chip b { font-weight: 600; color: var(--muted); }
  .chip button { border: 0; background: none; cursor: pointer; width: 1.4rem; height: 1.4rem; border-radius: 50%; color: var(--muted); line-height: 1; }
  .chip button:hover { background: var(--surface); color: var(--text); }
  .hint { font-size: .8rem; color: var(--muted); }

  /* KPI */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem 1rem; text-align: left; }
  .kpi .k { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: .35rem; }
  .kpi .v { font-size: 1.7rem; font-weight: 700; line-height: 1.25; margin-top: .15rem; }
  .kpi .v small { font-size: .9rem; font-weight: 500; color: var(--muted); margin-left: .2rem; }
  button.kpi { cursor: pointer; font: inherit; color: inherit; }
  button.kpi:hover { border-color: var(--accent); }
  .kpi.crit .v { color: var(--crit); }
  .kpi.warn .v { color: var(--warn); }
  .kpi.on { outline: 2px solid var(--accent); outline-offset: -1px; }
  .kpi .sub { font-size: .78rem; color: var(--muted); }

  /* 圖表卡 */
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .85rem .9rem .7rem; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; margin-bottom: .5rem; }
  .card-h h3 { font-size: .95rem; }
  .card-h .clr { font-size: .78rem; }
  .bars { display: flex; flex-direction: column; gap: 2px; }
  .bar { display: grid; grid-template-columns: minmax(4.5rem, 38%) 1fr 3.2rem; align-items: center; gap: .5rem; padding: .22rem .3rem; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; width: 100%; }
  .bar:hover, .bar:focus-visible { background: var(--surface-2); outline: none; }
  .bar:focus-visible { box-shadow: 0 0 0 2px var(--accent) inset; }
  .bar .bl { font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .bt { position: relative; height: 14px; }
  .bar .bg, .bar .bf { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; transition: width .25s ease; }
  .bar .bg { background: var(--ghost); }
  .bar .bf { background: var(--series); }
  .bar.off .bf { background: var(--off); }
  .bar.sel .bl { font-weight: 700; }
  .bar.sel .bl::before { content: "✓ "; color: var(--accent); }
  .bar .bn { font-size: .84rem; text-align: right; font-variant-numeric: tabular-nums; }
  .bar .bn small { color: var(--faint); }
  .more { margin-top: .35rem; }

  /* 直方圖 */
  .hist { position: relative; padding-top: 1.4rem; }
  .cols { position: relative; display: grid; gap: 2px; height: 130px; align-items: end; border-bottom: 1px solid var(--line); }
  .col { position: relative; height: 100%; border: 0; background: none; padding: 0; cursor: pointer; }
  .col:hover, .col:focus-visible { background: var(--surface-2); outline: none; }
  .col:focus-visible { box-shadow: 0 0 0 2px var(--accent) inset; }
  .col .g, .col .f { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 4px 4px 0 0; transition: height .25s ease; }
  .col .g { background: var(--ghost); }
  .col .f { background: var(--series); }
  .col.off .f { background: var(--off); }
  .col.sel { box-shadow: 0 -2px 0 var(--accent) inset; }
  .limit { position: absolute; top: -1.4rem; bottom: 0; width: 0; border-left: 2px solid var(--crit); pointer-events: none; }
  .limit span { position: absolute; top: 0; left: 4px; white-space: nowrap; font-size: .75rem; font-weight: 700; color: var(--crit); }
  .axis { position: relative; height: 1.3rem; font-size: .74rem; color: var(--faint); font-variant-numeric: tabular-nums; }
  .axis span { position: absolute; transform: translateX(-50%); top: .15rem; }
  .axis .unit { right: 0; transform: none; }
  .hist-note { font-size: .78rem; color: var(--muted); margin-top: .2rem; }

  /* 表格 */
  .tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 2rem; }
  .tcard-h { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  .tcard-h h2 { font-size: 1rem; }
  .tcard-h .spacer { flex: 1; }
  .tscroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .86rem; }
  th, td { padding: .5rem .65rem; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--surface); font-size: .78rem; color: var(--muted); font-weight: 600; }
  th button { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; color: inherit; }
  th button:hover { color: var(--accent); }
  th.r, td.r { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr.flag-crit td:first-child { box-shadow: 3px 0 0 var(--crit) inset; }
  tbody tr.flag-warn td:first-child { box-shadow: 3px 0 0 var(--warn-mark) inset; }
  .dwg { font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; font-variant-numeric: tabular-nums; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .badge { display: inline-flex; align-items: center; gap: .2rem; font-size: .76rem; font-weight: 700; padding: .05rem .45rem; border-radius: 999px; }
  .badge.crit { background: var(--crit-soft); color: var(--crit); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.ok { color: var(--muted); background: none; font-weight: 500; }
  .empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); }
  .tfoot { padding: .7rem 1rem; text-align: center; }

  /* 詳細抽屜 */
  .backdrop { position: fixed; inset: 0; background: rgba(10, 15, 20, .45); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); background: var(--surface); z-index: 41; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.18); }
  .drawer-h { padding: 1rem 1.25rem .8rem; border-bottom: 1px solid var(--line); }
  .drawer-h .row1 { display: flex; align-items: flex-start; gap: .75rem; }
  .drawer-h h2 { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .drawer-h .meta { color: var(--muted); font-size: .9rem; }
  .drawer-h .spacer { flex: 1; }
  .drawer-nav { display: flex; align-items: center; gap: .5rem; margin-top: .6rem; font-size: .84rem; color: var(--muted); flex-wrap: wrap; }
  .drawer-b { overflow-y: auto; padding: 1rem 1.25rem 2rem; }
  .x { border: 0; background: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted); padding: .1rem .3rem; }
  .x:hover { color: var(--text); }
  .alert { border-radius: 8px; padding: .65rem .9rem; font-size: .9rem; margin-bottom: .6rem; }
  .alert.crit { background: var(--crit-soft); border-left: 4px solid var(--crit); }
  .alert.warn { background: var(--warn-soft); border-left: 4px solid var(--warn-mark); }
  .alert.ok { background: var(--surface-2); border-left: 4px solid var(--good); }
  .alert b { margin-right: .25rem; }

  .pf { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: .8rem; }
  .pf .part { background: var(--accent-soft); font-weight: 700; padding: .4rem .8rem; font-size: .88rem; }
  .pf .r { display: grid; grid-template-columns: 7.5rem 1fr; border-top: 1px solid var(--line); }
  .pf .r > div { padding: .45rem .8rem; }
  .pf .r > div:first-child { font-weight: 600; font-size: .86rem; border-right: 1px solid var(--line); }
  .pf .part + .r { border-top: 0; }
  .opts { display: flex; flex-wrap: wrap; gap: .2rem .9rem; }
  .opt { color: var(--faint); white-space: nowrap; }
  .opt.on { color: var(--text); font-weight: 700; }
  .opt.extra { color: var(--warn); }
  .w4 { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
  .w4 > div { padding: .45rem .8rem; border-right: 1px solid var(--line); font-size: .84rem; }
  .w4 > div:last-child { border-right: 0; }
  .w4 b { display: block; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .sim h3 { font-size: .95rem; margin: 1.3rem 0 .5rem; }
  .sim table { font-size: .84rem; }
  @media (max-width: 560px) {
    .pf .r { grid-template-columns: 1fr; }
    .pf .r > div:first-child { border-right: 0; padding-bottom: 0; color: var(--muted); }
    .w4 { grid-template-columns: 1fr 1fr; }
    .w4 > div:nth-child(2) { border-right: 0; }
    .w4 > div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  }

  /* 匯入報告 */
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(640px, calc(100% - 32px)); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(10, 15, 20, .5); }
  .dlg-h { padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
  .dlg-b { padding: 1rem 1.25rem; max-height: 60vh; overflow-y: auto; }
  .dlg-f { padding: .8rem 1.25rem; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .dlg-f .spacer { flex: 1; }
  .big { font-size: 1.6rem; font-weight: 700; }
  .issues { list-style: none; padding: 0; margin: .5rem 0 0; font-size: .86rem; }
  .issues li { padding: .35rem 0; border-top: 1px solid var(--line); display: flex; gap: .5rem; }
  .issues .lv { flex: none; font-weight: 700; }
  .issues .lv.err { color: var(--crit); }
  .issues .lv.warn { color: var(--warn); }
  .issues .lv.info { color: var(--muted); }
  .issues .where { color: var(--muted); }

  /* 拖放 */
  .drop { position: fixed; inset: 0; z-index: 60; background: rgba(31, 95, 168, .14); border: 3px dashed var(--accent); display: grid; place-items: center; pointer-events: none; }
  .drop div { background: var(--surface); padding: 1.25rem 1.75rem; border-radius: 12px; font-size: 1.1rem; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.15); }

  /* 提示框 */
  .tip { position: fixed; z-index: 70; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .7rem; font-size: .82rem; box-shadow: 0 6px 20px rgba(0,0,0,.14); max-width: 16rem; }
  .tip strong { display: block; font-size: 1rem; }
  .tip .l { color: var(--muted); }

  .toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); z-index: 80; background: var(--text); color: var(--bg); padding: .55rem 1rem; border-radius: 8px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .fatal { background: var(--crit-soft); border-left: 4px solid var(--crit); padding: 1rem; border-radius: 8px; margin: 1rem 0; }

  @media print {
    body { background: #fff; color: #000; padding: 0; }
    body.print-detail > :not(#drawer) { display: none !important; }
    body.print-detail #drawer { position: static; width: auto; box-shadow: none; }
    body.print-detail .drawer-nav, body.print-detail .drawer-h .acts, body.print-detail .sim { display: none; }
    body.print-detail .drawer-b { overflow: visible; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <a class="back" href="./">← 回品質手冊</a>
    <h1>包裝規格查詢</h1>
    <div class="spacer"></div>
    <div class="acts">
      <button class="btn primary" type="button" id="btn-load">載入 Excel／CSV</button>
      <button class="btn" type="button" id="btn-template">下載總表範本</button>
      <button class="btn" type="button" id="btn-export">匯出目前結果</button>
    </div>
  </header>

  <div id="source" class="source demo" role="status"></div>

  <div class="filters">
    <div class="frow">
      <label class="search"><span class="sr" hidden>搜尋</span>
        <input id="q" type="search" placeholder="搜尋圖號、客戶、規格、材質、備註…" autocomplete="off" aria-label="搜尋">
        <kbd>/</kbd>
      </label>
      <button class="btn" type="button" id="btn-undo" title="上一步（Ctrl／⌘ + Z）">↶ 上一步</button>
      <button class="btn" type="button" id="btn-clear">清除全部篩選</button>
      <button class="btn" type="button" id="btn-share" title="複製目前篩選畫面的連結">複製連結</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <section class="kpis" id="kpis" aria-label="摘要"></section>
  <section class="charts" id="charts" aria-label="交叉篩選圖表"></section>

  <section class="tcard" aria-label="規格清單">
    <div class="tcard-h">
      <h2>規格清單</h2>
      <span class="hint" id="tcount"></span>
      <div class="spacer"></div>
      <span class="hint">點任何一列，打開完整的包裝規格表</span>
    </div>
    <div class="tscroll"><table id="table"></table></div>
    <div id="tfoot"></div>
  </section>
</div>

<input type="file" id="file" accept=".xlsx,.xlsm,.xls,.csv" multiple hidden>
<div class="tip" id="tip" hidden></div>

<script src="assets/demo-data.js"></script>
<script src="assets/specs.js"></script>
</body>
</html>
